{% extends "evaluation/base_admin.html" %}

{% block title %}Settings - Admin Panel{% endblock %}

{% block content %}
<div class="dashboard">
    <h2>Settings</h2>
    <p class="text-muted">System configuration.</p>

    <div class="card mt-4">
        <div class="card-body">
            <h4>System Information</h4>
            <table class="table">
                <tr><td><strong>Django Version</strong></td><td>3.0.8</td></tr>
                <tr><td><strong>Database</strong></td><td>SQLite</td></tr>
                <tr><td><strong>Debug Mode</strong></td><td>Active</td></tr>
            </table>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h4>Quick Links</h4>
            <a href="/admin/" class="btn btn-outline-primary mr-2">Django Admin</a>
            <a href="/admin-panel/videos/" class="btn btn-outline-primary">Video List</a>
        </div>
    </div>
</div>
{% endblock %}
